<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — UMMTO Share</title>
  <link rel="stylesheet" href="../style/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a href="../index.html" class="logo">UMMTO<span>Share</span></a>
      <nav aria-label="Navigation principale">
        <ul class="nav-links">
          <li><a href="../index.html">Accueil</a></li>
          <li><a href="resources.html">Ressources</a></li>
          <li><a href="upload.html">Partager</a></li>
          <li><a href="leaderboard.html">Helpers</a></li>
          <li><a href="login.html" class="active">Connexion</a></li>
          <li><a href="register.html" class="btn-cta">Inscription</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <section class="form-card">
      <h1>Se connecter</h1>
      <p class="muted">Heureux de te revoir.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
          <small class="error" data-error-for="email"></small>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required />
          <small class="error" data-error-for="password"></small>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Connexion</button>
        <p class="form-footer">Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
        <div id="formMessage" class="form-message" role="status"></div>
      </form>

      <details class="demo-info">
        <summary>Comptes de démonstration</summary>
        <ul>
          <li><code>amine@ummto.dz</code> / <code>Helper2025</code> (Helper Or)</li>
          <li><code>lina@ummto.dz</code> / <code>Etudiant1</code></li>
        </ul>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; UMMTO Share</p></div>
  </footer>

  <script src="../javascript/auth.js"></script>
  <script src="../javascript/validation.js"></script>
  <script src="../javascript/login.js"></script>
</body>
</html>
